[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AI-nimator"
version = "0.0.1"
description = "Deterministic autoregressive controller for text/control-driven 3D skeletal animation (SMPL-22)."
readme = "README.md"
# PEP 621 requires a PEP 440 specifier here — NOT a Poetry caret ("^3.12"),
# which breaks Poetry 2.x (it now reads [project] first). Keep in sync with
# [tool.poetry.dependencies] python below.
requires-python = ">=3.12,<3.14"
authors = [{ name = "pazimor" }]
dependencies = [
  "numpy>=1.25",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "torch (==2.9.1)",
  "tqdm>=4.66",
  "transformers>=4.35",
  "kornia>=0.7",
  "pydantic (>=2.13.4,<3.0.0)",
  "tensorboard (>=2.20.0,<3.0.0)",
  "onnx (>=1.21.0,<2.0.0)",
  "onnxruntime (>=1.26.0,<2.0.0)",
  "streamlit (>=1.35.0,<2.0.0)",
  "plotly (>=5.20.0,<6.0.0)",
  "pandas (>=2.0.0,<3.0.0)",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-cov>=7",
  "coverage[toml]>=7.4",
  "import-linter>=2.0",
  "vulture>=2.10",
]
docs = [
  "sphinx>=7.2",
  "alabaster>=0.7",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ainimator*"]

[tool.poetry]
package-mode = true
packages = [{ include = "ainimator", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

[tool.black]
line-length = 80

[tool.isort]
profile = "black"

[tool.ruff]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
strict = true
pretty = true

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "src"]
testpaths = ["src", "test", "apps"]
markers = [
  "onnx: ONNX export and parity tests (Phase A8). Must stay green — CI contract §2.10.",
]

[tool.coverage.run]
source = ["src/shared"]
branch = true
omit = ["*/__init__.py", "*/test_*.py", "*/doc/*.py", "*/src/cli/*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
