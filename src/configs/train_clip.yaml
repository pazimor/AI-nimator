paths:
  dataset-root: "/Users/pazimor/dataset_preprocessed"
  # Optional: train only on selected preprocessed dataset folders.
  # Ex: ["KIT", "CMU", "ACCAD"]
  # dataset-folders: ["ACCAD", "BioMotionLab_NTroje", "BMLHandball", "BMLmovi", "CMU", "DFaust_67", "EKUT", "Eyes_Japan_Dataset", "HumanEva", "KIT", "MPI_HDM05", "MPI_Limits", "MPI_mosh", "SFU", "SSM_synced", "TotalCapture", "Transitions_mocap"]
  dataset-folders: ["ACCAD"] # for quick preview
  checkpoint-dir: output/clip
  # Network architecture is loaded from network.yaml
  network-config: "src/configs/network.yaml"

# ============================================
# Profile: Mac (32GB RAM, MPS GPU)
# ============================================
training:
  epochs: 500
  device: mps
  max-length: 256
  model-name: xlm-roberta-base
  validation-split: 0.1
  early-stopping-patience: 100
  batch-size: 8
  gradient-accumulation: 16
  MM-memory-limit-gb: 25.0
  weight-decay: 0.01
  # resume-checkpoint: output/clip/best_model.pt
  
  # Learning Rate (constant)
  learning-rate: 0.00001

# ============================================
# Profile: DGX Spark (128GB RAM, GB10 GPU)
# Use with: --profile spark
# ============================================
spark:
  epochs: 100
  device: cuda
  max-length: 256
  model-name: xlm-roberta-base
  validation-split: 0.1
  early-stopping-patience: 15
  batch-size: 64
  gradient-accumulation: 2
  MM-memory-limit-gb: 0.0
  weight-decay: 0.01
  
  # Learning Rate (constant)
  learning-rate: 0.0001
