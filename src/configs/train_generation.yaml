paths:
  dataset-root: "/Users/pazimor/dataset_preprocessed"
  # dataset-folders: ["ACCAD", "BioMotionLab_NTroje", "BMLHandball", "BMLmovi", "CMU", "DFaust_67", "EKUT", "Eyes_Japan_Dataset", "HumanEva", "KIT", "MPI_HDM05", "MPI_Limits", "MPI_mosh", "SFU", "SSM_synced", "TotalCapture", "Transitions_mocap"]
  dataset-folders: ["ACCAD"] # for quick preview
  clip-checkpoint: "../../output/clip/best_model-4-4-768-ACCAD.pt"
  checkpoint-dir: "../../output/generation"
  
  # Network architecture is loaded from network.yaml
  network-config: "network.yaml"
  validation-indices: "../../output/generation/validation_indices.json"

# ============================================
# Profile: Mac (32GB RAM, MPS GPU)
# ============================================
training:
  epochs: 1000
  device: mps
  max-length: 256
  model-name: xlm-roberta-base
  validation-split: 0.01
  early-stopping-patience: 30
  batch-size: 4
  gradient-accumulation: 2
  max-samples-per-epoch: 10000
  MM-memory-limit-gb: 20.0
  resume-checkpoint: output/generation/best_model.pt
  
  learning-rate: 0.00001
  xyz-weight: 10.0
  xyz-weight-schedule: timestep
  vel-xyz-weight: 1.0
  diffusion-weight: 1.0
  acceleration-weight: 0.02
  clip-guidance-weight: 0.1

# ============================================
# Profile: Overfit 16
# ============================================
overfit:
  epochs: 1000
  device: mps
  max-length: 256
  model-name: xlm-roberta-base
  validation-split: 0.0
  early-stopping-patience: 30
  batch-size: 4
  gradient-accumulation: 1
  max-samples-per-epoch: 10000
  
  # overfit: fixed count ("16") or 1-based inclusive range ("3:6")
  overfit-samples: "10:10"
  clear-mps-cache: false
  # Deterministic corruption now mixes in a per-step counter, so each batch
  # cycles through every diffusion timestep while staying reproducible.
  # Previous versions hashed the sample id only, which locked the denoiser
  # to a single timestep -- DDIM inference then collapsed to a noisy "mean
  # pose" even on a one-sample overfit run.
  deterministic-corruption: true
  disable-dropout: true

  MM-memory-limit-gb: 20.0
  # Overfit debugging should start from scratch to keep the loss curve
  # interpretable when the objective or enabled features change.
  resume-checkpoint: output/generation/best_model.pt
  
  learning-rate: 0.00001
  xyz-weight: 1.0
  xyz-weight-schedule: timestep
  vel-xyz-weight: 1.0
  diffusion-weight: 1.0
  acceleration-weight: 0.0
  clip-guidance-weight: 0.0
