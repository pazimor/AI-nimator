# ============================================
# Network Architecture Configuration
# ============================================
# This file defines the neural network architecture for both
# CLIP and Generation models. The top-level embed-dim configures
# CLIP, while generation.embed-dim can override the denoiser width.
# ============================================

# ============================================
# Profile: Mac (32GB RAM, MPS GPU)
# Default profile for local development
# ============================================
default:
  # CLIP embedding dimension (must match the CLIP checkpoint output size)
  embed-dim: 768

  # CLIP Motion Encoder Architecture
  clip:
    motion-num-heads: 4
    motion-num-layers: 4
    # The preprocessed dataset can still store extra motion features
    # for retrieval and generation.
    bone-data:
      rotation6d: true
      foot-contact: true
      hand-contact: true
      root-translation: true
      root-velocity: true
      root-yaw: true
      root-yaw-velocity: true
      joint-xyz: true
      joint-velocity: true
      end-effector-velocity: false
      pelvis-height: false

  generation:
    # Shrink to reduce params/sample ratio (~196M / 1482 samples was
    # ~132k params/sample, encouraging per-sample memorisation).  Going
    # 768→512 + 6→4 layers drops params roughly to ~60-70M (~45k/sample),
    # which lets the denoiser commit capacity to the rot6d signal rather
    # than the trajectory.  Top-level embed-dim stays 768 so the existing
    # CLIP checkpoint still loads unchanged.
    embed-dim: 512
    num-heads: 8
    num-layers: 6
    num-bones: 22
    diffusion-steps: 1000
    num-spatial-layers: 2
    num-spatio-temporal-layers: 4

    bone-data:
      rotation6d: true
      foot-contact: true
      hand-contact: false
      root-translation: true
      # root-velocity DISABLED (Option B fresh-start).  We previously
      # enabled it to add a Δrtrans signal but the pytorch-auditor on the
      # 144-epoch best_model.pt revealed that the rvel channels have
      # std ≈ 2 mm/frame in raw space (ch7=0.006, ch8=0.006, ch9=0.002).
      # After Z-normalization the diffusion noise N(0,1) added to the
      # forward process completely overwhelms the actual rvel signal
      # (post-norm SNR ≈ 1) — the denoiser learns to predict ≈ 0 in
      # normalized space, so dequantization × 0.002 ≈ 0 in raw space.
      # The aux loss `loss_root_velocity` is dead (rvel=0.0000 in logs),
      # AND 30% of `loss_global_diffusion` becomes pure noise,
      # contaminating the 7 useful channels.  Keep disabled until we
      # implement per-component normalization (e.g. amplitude-scale rvel
      # by 100× before z-norm so post-norm std ≈ 0.5 — out of scope here).
      root-velocity: false
      root-yaw: false
      root-yaw-velocity: false
      joint-xyz: true
      joint-velocity: false
      end-effector-velocity: false
      pelvis-height: false
      # foot_contact uses BCE loss on raw (non-normalized) values.
      # FootContactComponent has skipNormalization=True, so global stats
      # are forced to mean=0/std=1 and the denoiser predicts logits.
      # Sigmoid is applied at inference time.

# ============================================
# Profile: Overfit
# Narrower auxiliary supervision to make one-motion memorization stable.
# Keep the CLIP motion layout identical to the checkpoint, but reduce the
# generation-side targets to the signals that matter most for locomotion.
# ============================================
overfit:
  embed-dim: 768

  clip:
    motion-num-heads: 4
    motion-num-layers: 4
    bone-data:
      rotation6d: true
      foot-contact: true
      hand-contact: true
      root-translation: true
      root-velocity: true
      root-yaw: true
      root-yaw-velocity: true
      joint-xyz: true
      joint-velocity: true
      end-effector-velocity: false
      pelvis-height: false

  generation:
    embed-dim: 768
    num-heads: 4
    num-layers: 4
    num-bones: 22
    diffusion-steps: 1000
    # Overfit: skip the spatial/spatio-temporal pre-blocks that process
    # pure noise *before* the conditioning token is prepended (pure MDM
    # design has none). Keeping them active on a single-sample regime was
    # drowning the text/timestep signal and collapsing the sampled motion
    # toward the mean pose.
    num-spatial-layers: 0
    num-spatio-temporal-layers: 0

    bone-data:
      rotation6d: true
      foot-contact: true
      hand-contact: false
      root-translation: true
      root-velocity: true
      root-yaw: false
      root-yaw-velocity: false
      joint-xyz: true
      joint-velocity: true
      end-effector-velocity: true
      pelvis-height: false

# ============================================
# Profile: v2 (refonte)
# ============================================
# Lean representation + compact denoiser, matching the v2 plan:
# * 4 transformer blocks, embedDim 384, 8 heads (vs 6/512/8 in `default`)
# * No spatial GCN, no spatio-temporal mix layers
# * Only rotation6d (132 ch) + root_translation (3 ch) = 135 channels
#   active.  All FK-derivable signals (joint_xyz, joint_velocity,
#   foot_contact, end_effector_velocity, pelvis_height) are disabled —
#   they are computed at the loss stage from rotation6d via FK rather
#   than predicted as redundant channels.
#
# This profile is consumed by the v2 stack
# (`src.shared.model.generation.denoiser_v2.MotionDenoiserV2`).  The
# legacy `default` and `overfit` profiles continue to drive
# `src.shared.model.generation.denoiser.MotionDenoiser` until the
# migration completes.
# ============================================
v2:
  # Top-level embed-dim is unused by v2 (no CLIP contrastive pre-train).
  # Kept for schema compatibility with the loader.
  embed-dim: 384

  # CLIP block: kept to satisfy the loader, but the v2 stack does NOT
  # use this branch.  Will be removed once the legacy CLIP module is
  # archived (Phase A.6).
  clip:
    motion-num-heads: 4
    motion-num-layers: 2
    bone-data:
      rotation6d: true
      foot-contact: false
      hand-contact: false
      root-translation: true
      root-velocity: false
      root-yaw: false
      root-yaw-velocity: false
      joint-xyz: false
      joint-velocity: false
      end-effector-velocity: false
      pelvis-height: false

  generation:
    # MotionDenoiserV2: compact stack, cross-attn only.
    embed-dim: 384
    num-heads: 8
    num-layers: 4
    num-bones: 22
    diffusion-steps: 1000
    # No spatial/spatio-temporal pre-blocks in v2 — they were removed
    # from MotionDenoiserV2 entirely.  Both flags must stay at 0.
    num-spatial-layers: 0
    num-spatio-temporal-layers: 0

    bone-data:
      rotation6d: true        # primary motion signal (132 ch)
      root-translation: true  # global trajectory (3 ch)
      # All other channels are disabled.  FK-derivable signals are
      # supervised through the auxiliary `vel_xyz_loss` instead of
      # being predicted.
      foot-contact: false
      hand-contact: false
      root-velocity: false
      root-yaw: false
      root-yaw-velocity: false
      joint-xyz: false
      joint-velocity: false
      end-effector-velocity: false
      pelvis-height: false
