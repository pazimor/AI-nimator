# ============================================
# Network Architecture Configuration
# ============================================
# v2 stack only (phase A5 — 2026-06-13).
# The v1 "default" and "overfit" profiles have been archived to
# legacy/configs/network_v1_profiles.yaml and are no longer loaded
# by any live code.
# ============================================

# ============================================
# Profile: v2 (refonte) — sole active profile
# ============================================
# Lean representation + compact denoiser:
# * 4 transformer blocks, embedDim 384, 8 heads
# * No spatial GCN, no spatio-temporal mix layers
# * Only rotation6d (132 ch) + root_translation (3 ch) = 135 channels
#   active.  All FK-derivable signals (joint_xyz, joint_velocity,
#   foot_contact, end_effector_velocity, pelvis_height) are disabled —
#   they are computed at the loss stage from rotation6d via FK rather
#   than predicted as redundant channels.
#
# Phase F (2026-05-12) — the SOTA conditioning levers (FiLM + per-block
# AdaLN) and the learnable null embedding are now ON by default in the
# Python dataclasses (V2FullTrainingConfig / MotionDenoiserV2Config).
# ============================================
v2:
  # Top-level embed-dim is unused by v2 (no CLIP contrastive pre-train).
  # Kept for schema compatibility with the loader.
  embed-dim: 384

  # CLIP block: kept to satisfy the loader schema; the v2 stack does NOT
  # use this branch (archived in phase A5).
  clip:
    motion-num-heads: 4
    motion-num-layers: 2
    bone-data:
      rotation6d: true
      foot-contact: false
      hand-contact: false
      root-translation: true
      root-velocity: false
      root-yaw: false
      root-yaw-velocity: false
      joint-xyz: false
      joint-velocity: false
      end-effector-velocity: false
      pelvis-height: false

  generation:
    # ============================================================
    # Goal C — engine selector (ROADMAP_DETERMINIST §3.2)
    # ============================================================
    # "diffusion" = canonical behaviour (default, nothing changes).
    # "controller" = Goal C deterministic autoregressive engine.
    # The training CLI reads this field; defaults keep diffusion.
    model-type: diffusion          # diffusion | controller

    controller:
      autoregressive: true
      phase: explicit              # none | explicit | learned
      # DEFERRED: the current dataset (AMASS + HumanML3D/KIT captions)
      # has no style labels (§1/§7).  Must stay false until C3.
      style-latent: false
      # Autoregressive context window (frames seen per forward).
      context-frames: 1            # extended in C4 (long robustness)
      losses:
        velocity-loss: true        # flag already present in v2
        foot-contact-loss: true
        geodesic-rotation: true
      training:
        # Scheduled-sampling ramp 0 → target (fixes exposure bias).
        # Stays 0 until short-rollout validation passes (C4).
        scheduled-sampling: 0.0

    # MotionDenoiserV2 (Phase F): compact stack, cross-attn + FiLM +
    # per-block AdaLN.
    #
    # B1-bis frozen recipe (2026-06-13) — the validated 640d/8L denoiser
    # that solves N=1000 (retrieval 5/5 at cfg=6, LOG.md 2026-06-12).
    # Capacity↔N law: params ≈ ∝ N (640/8 ≈ 90M holds N=1000).
    #
    # ⚠ NOTE: the v2 TRAINING path does NOT read this block.
    # ``loadNetworkConfig`` (core/config_loader.py) is wired only into
    # ``preprocess_dataset`` (feature toggles / bone-data).  The denoiser
    # dims actually used come from the CLI defaults / V2FullTrainingConfig
    # dataclass (currently 384/4/8) or explicit flags.  The AUTHORITATIVE
    # B1-bis run config lives in ``scripts/consolidate_n1000_v2.py``.
    # This block is kept in sync as canonical documentation.
    embed-dim: 640
    num-heads: 8
    num-layers: 8
    num-bones: 22
    diffusion-steps: 1000
    # No spatial/spatio-temporal pre-blocks in v2 — removed from
    # MotionDenoiserV2 entirely.  Both flags must stay at 0.
    num-spatial-layers: 0
    num-spatio-temporal-layers: 0
    # Phase F flags — also defaulted to True in the Python dataclasses.
    use-film-conditioning: true
    use-per-block-film: true
    use-null-embedding: true

    bone-data:
      rotation6d: true        # primary motion signal (132 ch)
      root-translation: true  # global trajectory (3 ch)
      # All other channels are disabled.  FK-derivable signals are
      # supervised through the auxiliary vel_xyz_loss instead of
      # being predicted.
      foot-contact: false
      hand-contact: false
      root-velocity: false
      root-yaw: false
      root-yaw-velocity: false
      joint-xyz: false
      joint-velocity: false
      end-effector-velocity: false
      pelvis-height: false
